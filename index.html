<script>
(function () {
    // БАПТАУЛАР
    const SPEED_PX_PER_SEC = 100;
    const RESTART_DELAY_MS = 3000;
    const AUTOSCROLL_START_DELAY_MS = 7000;

    // ЭЛЕМЕНТТЕР
    const modal = document.getElementById("musicModal");
    const introVideo = document.getElementById("introVideo");
    const playButton = document.getElementById("playMusic");
    const audio = document.getElementById("backgroundMusic");

    // БАСТАПҚЫ КҮЙ
    let started = false;
    let pageOpened = false;
    let isRunning = false;
    let resumeTimer = null;
    let startTimer = null;
    let rafId = null;
    let lastTs = 0;
    let accum = 0;

    // МОДАЛЬ АШЫҚ КЕЗДЕ СКРОЛЛДЫ БҰҒАТТАУ
    document.body.classList.add("modal-open");
    document.body.style.overflow = "hidden";
    document.documentElement.style.scrollBehavior = "auto";
    document.body.style.scrollBehavior = "auto";

    // ҚАУІПСІЗ СКРОЛЛ
    function safeScrollBy(step) {
        window.scrollBy(0, step);
    }

    function atBottom() {
        const maxScroll = Math.max(
            document.documentElement.scrollHeight,
            document.body.scrollHeight
        ) - window.innerHeight;

        const y = window.scrollY ||
            document.documentElement.scrollTop ||
            document.body.scrollTop || 0;

        return y >= maxScroll - 1;
    }

    // АВТОСКРОЛЛ ЦИКЛІ
    function loop(ts) {
        rafId = null;

        if (pageOpened && isRunning) {
            if (!lastTs) lastTs = ts;

            const dt = Math.min(ts - lastTs, 100);
            lastTs = ts;

            accum += (SPEED_PX_PER_SEC * dt) / 1000;

            const step = Math.floor(accum);

            if (step >= 1) {
                accum -= step;

                if (atBottom()) {
                    stopAuto();
                    return;
                }

                safeScrollBy(step);
            }
        } else {
            lastTs = ts;
        }

        if (pageOpened) {
            rafId = requestAnimationFrame(loop);
        }
    }

    function startAuto() {
        if (!pageOpened) return;

        isRunning = true;

        if (!rafId) {
            lastTs = 0;
            rafId = requestAnimationFrame(loop);
        }
    }

    function stopAuto() {
        isRunning = false;
        lastTs = 0;
    }

    function restartAfterDelay() {
        if (!pageOpened) return;

        clearTimeout(resumeTimer);
        stopAuto();

        resumeTimer = setTimeout(function () {
            startAuto();
        }, RESTART_DELAY_MS);
    }

    // ПАЙДАЛАНУШЫ ӘРЕКЕТТЕРІ
    function onInteract() {
        if (!pageOpened) return;
        restartAfterDelay();
    }

    window.addEventListener("wheel", onInteract, {
        passive: true
    });

    window.addEventListener("touchstart", onInteract, {
        passive: true
    });

    window.addEventListener("touchmove", onInteract, {
        passive: true
    });

    window.addEventListener("mousedown", onInteract, {
        passive: true
    });

    window.addEventListener("keydown", onInteract);

    document.addEventListener("visibilitychange", function () {
        if (!pageOpened) return;

        if (document.hidden) {
            stopAuto();
            clearTimeout(resumeTimer);
        } else {
            restartAfterDelay();
        }
    });

    // PNG СУРЕТІН БАСҚАНДА ВИДЕОНЫ БАСТАУ
    playButton.addEventListener("click", async function () {
        if (started) return;

        started = true;
        playButton.style.pointerEvents = "none";

        try {
            introVideo.muted = false;
            introVideo.currentTime = 0;

            await introVideo.play();

            modal.classList.add("playing");

        } catch (error) {
            started = false;
            playButton.style.pointerEvents = "auto";

            console.error(
                "Видеоны ойнату мүмкін болмады:",
                error
            );
        }
    });

    // ВИДЕО ТОЛЫҚ АЯҚТАЛҒАНДА
    introVideo.addEventListener("ended", function () {
        if (pageOpened) return;

        pageOpened = true;

        // МОДАЛЬДЫ ЖАБУ
        modal.style.display = "none";
        document.body.classList.remove("modal-open");
        document.body.style.overflow = "";

        // МУЗЫКАНЫ ҚОСУ
        audio.volume = 1;

        audio.play().catch(function (error) {
            console.warn(
                "Музыканы автоматты ойнату бұғатталды:",
                error
            );
        });

        // 7 СЕКУНДТАН КЕЙІН АВТОСКРОЛЛДЫ БАСТАУ
        startTimer = setTimeout(function () {
            startAuto();
        }, AUTOSCROLL_START_DELAY_MS);
    });

    // ВИДЕО ҚАТЕСІ
    introVideo.addEventListener("error", function () {
        console.error(
            "yul.mp4 файлын жүктеу мүмкін болмады. Файл жолын тексер."
        );
    });

})();
</script>




  <script async>




const URL_APP = "https://script.google.com/macros/s/AKfycbwQKbn_orPO9aQ8KweFTRErtIKTUayZ3euMrINyx5ooA2rxJ8Ajvkx-iyQFGu2c7wRL/exec";

const form = document.querySelector("#form");
form.action = URL_APP;

// --- Екінші сұрақ логикасы ---
const decreaseBtn = document.querySelector("#decrease");
const increaseBtn = document.querySelector("#increase");
const countDisplay = document.querySelector("#peopleCount");
const hiddenChoice = document.querySelector("#choice");

let count = 1;

decreaseBtn.addEventListener("click", () => {
  if (count > 1) {
    count--;
    countDisplay.textContent = count;
    hiddenChoice.value = count;
  }
});

increaseBtn.addEventListener("click", () => {
  count++;
  countDisplay.textContent = count;
  hiddenChoice.value = count;
});

// --- Форма жіберу ---
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();

  const name = document.querySelector("[name=name]:checked");
  const choice = document.querySelector("[name=choice]");
  const message = document.querySelector("[name=message]");

  let details = {
    name: name ? name.value : '',
    choice: choice ? choice.value : '',
    message: message.value.trim(),
  };

  let formBody = [];
  for (let property in details) {
    let encodedKey = encodeURIComponent(property);
    let encodedValue = encodeURIComponent(details[property]);
    formBody.push(encodedKey + "=" + encodedValue);
  }
  formBody = formBody.join("&");

  // Форма тазалау
  if (name) name.checked = false;
  count = 1;
  countDisplay.textContent = count;
  hiddenChoice.value = count;
  message.value = '';

  alert('Жообуңузга рахмат!');

  fetch(URL_APP, {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
    },
    mode: "no-cors",
    body: formBody,
  }).catch((err) => {
    console.error('Error:', err);
    alert("Қате орын алды!");
  });
});










    document.addEventListener("DOMContentLoaded", function() {

        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
          }
        });
      });

      var elements = document.querySelectorAll(".fade-in");
      elements.forEach(function(element) {
        observer.observe(element);
      });
    });
  </script>

     function onEntry(entry) { 
      entry.forEach(change => { 
        if (change.isIntersecting) { 
         change.target.classList.add('element-show'); 
         
        } 
      }); 
    } 
        let options = { 
      threshold: [0.5] }; 
    let observer = new IntersectionObserver(onEntry, options); 
    let elements = document.querySelectorAll('.element-animation'); 
     
    for (let elm of elements) { 
      observer.observe(elm); 
    }


</script>
